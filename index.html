.lockup {

  width: clamp(280px, 42vw, 580px);
  height: auto;
  overflow: visible;
}
.mark { fill: var(--ink); opacity: 0; animation: rise 2600ms cubic-bezier(.2,.6,.2,1) 500ms forwards; }

  font-weight: 500;
  opacity: 0;
  animation: rise 2400ms cubic-bezier(.2,.6,.2,1) 1700ms forwards;
}
@keyframes rise { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .mark, .name { animation: none; opacity: 1; }
}
::selection { background: transparent; }
